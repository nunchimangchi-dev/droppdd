name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gated at "critical" rather than "high": there's a known high-severity
      # finding (deepmerge-ts stack exhaustion, via @prisma/config) whose only
      # fix path downgrades Prisma to 6.x, a breaking change we're not taking
      # unreviewed. See docs/SECURITY-BASELINE.md. Revisit when Prisma 7
      # picks up a patched deepmerge-ts.
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: npx prisma db seed
        env:
          DATABASE_URL: file:./prisma/dev.db
      - run: npm run build
